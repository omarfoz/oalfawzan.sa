name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate static site
        run: python3 scripts/validate_site.py

      - name: Validate interface guidelines
        run: python3 scripts/validate_interface.py

      - name: Check shared JavaScript syntax
        run: node --check web-guidelines.js && node --check theme.js && node --check data.js
