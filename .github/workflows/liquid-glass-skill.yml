name: OAlfawzan Liquid Glass Skill v2

on:
  pull_request:
    paths:
      - '.agents/skills/oalfawzan-liquid-glass/**'
      - '.github/workflows/liquid-glass-skill.yml'
  push:
    paths:
      - '.agents/skills/oalfawzan-liquid-glass/**'
      - '.github/workflows/liquid-glass-skill.yml'

permissions:
  contents: read

jobs:
  skill-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        working-directory: .agents/skills/oalfawzan-liquid-glass
        run: python -m unittest discover -s tests -v
      - name: Compile and scaffold a working site
        run: |
          SKILL=.agents/skills/oalfawzan-liquid-glass
          python -m compileall -q "$SKILL/scripts" "$SKILL/tests"
          python "$SKILL/scripts/scaffold.py" \
            --output "$RUNNER_TEMP/oalfawzan-skill-site" \
            --name 'Test Studio' \
            --headline 'Building useful experiences.' \
            --description 'A sample test page generated with the skill.' \
            --email 'test@example.org' \
            --about 'A simple example for automated validation.' \
            --item 'Example|A functional external project|https://example.org'
          python "$SKILL/scripts/validate.py" --site "$RUNNER_TEMP/oalfawzan-skill-site"
      - name: Browser dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Six real-browser smoke checks
        run: |
          python .agents/skills/oalfawzan-liquid-glass/scripts/browser_smoke.py \
            --site "$RUNNER_TEMP/oalfawzan-skill-site" \
            --screenshots "$RUNNER_TEMP/oalfawzan-skill-screenshots"
